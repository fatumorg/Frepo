name: frepo

on:
  push:
    branches: [main]
    paths:
      - "pkgs/**"
      - "scripts/**"
      - "flake.*"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: frepo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run unittest suite
        run: python3 -I -m unittest discover -s scripts

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run flake check
        run: nix flake check

  plan:
    name: plan builds
    needs: [test, nix]
    runs-on: ubuntu-latest
    outputs:
      matrix0: ${{ steps.matrix.outputs.matrix0 }}
      count0: ${{ steps.matrix.outputs.count0 }}
      matrix1: ${{ steps.matrix.outputs.matrix1 }}
      count1: ${{ steps.matrix.outputs.count1 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compute missing build matrices
        id: matrix
        run: |
          for stage in 0 1; do
            matrix=$(python3 -I scripts/frepo.py matrix --missing --stage "$stage")
            echo "matrix$stage=$matrix" >> "$GITHUB_OUTPUT"
            echo "count$stage=$(echo "$matrix" | python3 -I -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"
          done

  build-base:
    name: build independent packages
    needs: plan
    if: needs.plan.outputs.count0 != '0'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix0 }}

  build-dependent:
    name: build dependent packages
    needs: [plan, build-base]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count1 != '0' }}
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix1 }}

  release:
    name: publish release assets
    needs: [plan, build-base, build-dependent]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.count0 != '0' || needs.plan.outputs.count1 != '0') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
      - name: Create releases and upload assets
        run: |
          shopt -s nullglob
          for dir in artifacts/dist-*/; do
            name=$(basename "$dir")
            rest=${name#dist-}
            target=${rest%%-*}
            key=${rest#*-}
            gh release view "$key" >/dev/null 2>&1 || gh release create "$key" --prerelease --title "$key" --notes "$key"
            stage=$(mktemp -d)
            for f in "$dir"*.pkg.tar.zst "$dir"*.deb "$dir"*.rpm "$dir"*.xbps; do
              cp "$f" "$stage/$target--$(basename "$f")"
            done
            gh release upload "$key" "$stage"/* --clobber
          done
